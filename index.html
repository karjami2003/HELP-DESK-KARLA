<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design System - Help Desk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Design System - Help Desk</h1>
    <p>Biblioteca de Componentes UI</p>
</header>

<section class="container">

    <h2>Botones</h2>

    <button class="btn btn-primary">Botón Primario</button>

    <button class="btn btn-secondary">Botón Secundario</button>

    <button class="btn btn-danger">Botón Peligro</button>

    <hr>

    <h2>Formulario</h2>

    <input type="text" placeholder="Ingrese su nombre">

    <br><br>

    <select>
        <option>Seleccione prioridad</option>
        <option>Alta</option>
        <option>Media</option>
        <option>Baja</option>
    </select>

    <hr>

    <h2>Tarjeta</h2>

    <div class="card">
        <h3>Ticket #001</h3>
        <p>Error al iniciar sesión del usuario.</p>

        <span class="badge alta">Alta</span>
    </div>

    <hr>

    <h2>Badges</h2>

    <span class="badge alta">Alta</span>

    <span class="badge media">Media</span>

    <span class="badge baja">Baja</span>

</section>

</body>
</html>

<footer>
    <p>Design System - Help Desk © 2026</p>
    <p>Desarrollado por Karla Moreira</p>
</footer>

spring.application.name=backend-help
# Puerto donde correrá Spring Boot
server.port=8080
# Configuración de la base de datos en memoria H2
spring.datasource.url=jdbc:h2:mem:helpdeskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Crea las tablas automáticamente al iniciar
spring.jpa.hibernate.ddl-auto=update